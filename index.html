var z = 0;
function countdown() {
    var now = new Date(); var aktuellzeit = now.getTime() / 1000;
    var shuttlestarts = [new Date(2011, 6, 8, 0, 0, 0), new Date(2024, 7, 26, 0, 0, 0), new Date(2024, 8, 24, 0, 0, 0), new Date(2024, 9, 10, 0, 0, 0), new Date(2099, 8, 9, 9, 9, 9)];
    var monatsname = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober", "November", "Dezember"];
    while (z < shuttlestarts.length - 1 && (shuttlestarts[z].getTime() / 1000) < aktuellzeit) { z++; }
    var zielDatum = shuttlestarts[z];
    var rest = Math.floor((zielDatum.getTime() / 1000) - aktuellzeit);
    if (rest < 0) rest = 0;
    var ctag = Math.floor(rest / 86400); var cstunde = Math.floor(rest / 3600) - (ctag * 24); var cminute = Math.floor(rest / 60) - (ctag * 1440) - (cstunde * 60); var csekunde = rest - (ctag * 86400) - (cstunde * 3600) - (cminute * 60);
    if (document.tafel) {
        document.tafel.countertag.value = "      " + (ctag < 10 ? "0"+ctag : ctag);
        document.tafel.counterstunde.value = "       " + (cstunde < 10 ? "0"+cstunde : cstunde);
        document.tafel.counterminute.value = "       " + (cminute < 10 ? "0"+cminute : cminute);
        document.tafel.counterssekunde.value = "       " + (csekunde < 10 ? "0"+csekunde : csekunde);
        document.tafel.beschreibung.value = "Der nächste Raketenstart erfolgt am :    " + zielDatum.getDate() + "." + monatsname[zielDatum.getMonth()] + " " + zielDatum.getFullYear();
    }
    setTimeout(countdown, 1000);
}
